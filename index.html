<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typer Premier League</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/Qv1dF627/ubc.png">
    <style>
        :root { 
            --primary: #38003c; --accent: #00ff87; --bg: #f6f6f6; --card: #ffffff; 
            --text: #333333; --border: #e0e0e0; --input-bg: #edf2f7;
            --exact-match: #28a745; --exact-text: #ffffff;
            --winner-match: #ffc107; --winner-text: #000000;
        }
        body.dark-mode {
            --bg: #120014; --card: #1f1124; --text: #f6f6f6; --border: #4a2850; --input-bg: #2d1830;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; position: relative; }
        .theme-toggle { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: var(--accent); border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .header-banner { background: #38003c; color: #fff; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .header-banner h1 { color: var(--accent); margin: 0; font-size: 24px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-sizing: border-box; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        input[type="text"] { font-size: 16px; text-align: center; border: 2px solid var(--accent); background: var(--card); color: var(--text); }
        button { background: #38003c; color: var(--accent); font-weight: bold; cursor: pointer; font-size: 16px; }
        .hidden { display: none !important; }
        .match-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .match-info { display: flex; flex-direction: column; width: 65%; }
        .match-teams { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .team-logo { width: 20px; height: 20px; object-fit: contain; }
        .score-inputs { display: flex; gap: 6px; align-items: center; }
        .score-inputs input { width: 38px; text-align: center; margin: 0; padding: 4px; background: var(--input-bg); color: var(--text); }
        .progress-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #38003c; padding: 6px; border-radius: 6px; margin-bottom: 15px; }
        .progress-step { color: #fff; background: rgba(255,255,255,0.1); cursor: pointer; padding: 8px 0; border-radius: 4px; text-align: center; font-size: 12px; font-weight: bold; }
        .progress-step.active { color: #38003c; background: var(--accent); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; white-space: nowrap; }
        th, td { padding: 8px 4px; text-align: center; border: 1px solid var(--border); font-size: 12px; }
        th { color: var(--accent); background: #38003c; }
        .tag-exact { background-color: var(--exact-match) !important; color: var(--exact-text) !important; font-weight: bold; }
        .tag-winner { background-color: var(--winner-match) !important; color: var(--winner-text) !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Ciemny</button>
    <div class="header-banner"><h1>🏆 TYPER PREMIER LEAGUE ⚽</h1></div>

    <div id="login-screen" class="card">
        <h2>Podaj Swój Nick:</h2>
        <input type="text" id="nick-input" placeholder="Wpisz nick...">
        <button onclick="loginUser()">Dołącz</button>
    </div>

    <div id="app-screen" class="hidden">
        <div class="card">
            <h3>Gracz: <span id="user-display" style="color:var(--accent)"></span></h3>
            <div class="progress-bar" id="steps-bar"></div>
            <div id="matches-list">Ładowanie meczów...</div>
            <button id="save-btn" onclick="submitEntireRound()" style="background:#028a5a; color:white; margin-top:15px;">💾 Zapisz Typy</button>
        </div>

        <div class="card">
            <h3>📊 Wszystkie Typy</h3>
            <div class="table-container">
                <table>
                    <thead><tr id="all-preds-header"><th>Gracz</th></tr></thead>
                    <tbody id="all-preds-body"><tr><td>Ładowanie...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>🏆 Tabela Liderów</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Poz.</th><th style="text-align:left; padding-left:10px;">Gracz</th><th>Punkty</th></tr>
                    </thead>
                    <tbody id="leaderboard-body"><tr><td colspan="3">Obliczanie wyników...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz66hvdvdCCe3r4QU97eiFZrBjryV3hCQgbKqhSsBVpWTAVrnXf1psf3z6uUZZOUlahpA/exec";
    const GITHUB_LOGOS_URL = "https://cdn.jsdelivr.net/gh/ubico-mundial/premier-league@main/logos/";

    const TEAM_LOGOS = {
        "Arsenal": GITHUB_LOGOS_URL + "england_arsenal_64x64.football-logos.cc.png",
        "Coventry City": GITHUB_LOGOS_URL + "england_coventry-city_64x64.football-logos.cc.png",
        "Hull City": GITHUB_LOGOS_URL + "england_hull-city_64x64.football-logos.cc.png",
        "Manchester United": GITHUB_LOGOS_URL + "england_manchester-united_64x64.football-logos.cc.png",
        "Everton": GITHUB_LOGOS_URL + "england_everton_64x64.football-logos.cc.png",
        "Crystal Palace": GITHUB_LOGOS_URL + "england_crystal-palace_64x64.football-logos.cc.png",
        "Ipswich Town": GITHUB_LOGOS_URL + "england_ipswich_64x64.football-logos.cc.png",
        "Sunderland": GITHUB_LOGOS_URL + "england_sunderland_64x64.football-logos.cc.png",
        "Nottingham Forest": GITHUB_LOGOS_URL + "england_nottingham-forest_64x64.football-logos.cc.png",
        "Leeds United": GITHUB_LOGOS_URL + "england_leeds-united_64x64.football-logos.cc.png",
        "Brentford": GITHUB_LOGOS_URL + "england_brentford_64x64.football-logos.cc.png",
        "Tottenham Hotspur": GITHUB_LOGOS_URL + "england_tottenham_64x64.football-logos.cc.png",
        "Brighton": GITHUB_LOGOS_URL + "england_brighton_64x64.football-logos.cc.png",
        "Aston Villa": GITHUB_LOGOS_URL + "england_aston-villa_64x64.football-logos.cc.png",
        "Manchester City": GITHUB_LOGOS_URL + "england_manchester-city_64x64.football-logos.cc.png",
        "AFC Bournemouth": GITHUB_LOGOS_URL + "england_bournemouth_64x64.football-logos.cc.png",
        "Newcastle United": GITHUB_LOGOS_URL + "england_newcastle_64x64.football-logos.cc.png",
        "Liverpool": GITHUB_LOGOS_URL + "england_liverpool_64x64.football-logos.cc.png",
        "Fulham": GITHUB_LOGOS_URL + "england_fulham_64x64.football-logos.cc.png",
        "Chelsea": GITHUB_LOGOS_URL + "england_chelsea_64x64.football-logos.cc.png"
    };

    const roundsOrder = ["Kolejka 1", "Kolejka 2", "Kolejka 3", "Kolejka 4", "Kolejka 5"];
    let currentRoundIndex = 0; 
    let dbData = { predictions: {}, results: {} };

    const allMatches = [
        { id: "M1_1", round: "Kolejka 1", t1: "Arsenal", t2: "Coventry City", lock: "2026-08-21T21:00:00" },
        { id: "M1_2", round: "Kolejka 1", t1: "Hull City", t2: "Manchester United", lock: "2026-08-21T21:00:00" },
        { id: "M1_3", round: "Kolejka 1", t1: "Everton", t2: "Crystal Palace", lock: "2026-08-21T21:00:00" },
        { id: "M1_4", round: "Kolejka 1", t1: "Ipswich Town", t2: "Sunderland", lock: "2026-08-21T21:00:00" },
        { id: "M1_5", round: "Kolejka 1", t1: "Nottingham Forest", t2: "Leeds United", lock: "2026-08-21T21:00:00" },
        { id: "M1_6", round: "Kolejka 1", t1: "Brentford", t2: "Tottenham Hotspur", lock: "2026-08-21T21:00:00" },
        { id: "M1_7", round: "Kolejka 1", t1: "Brighton", t2: "Aston Villa", lock: "2026-08-21T21:00:00" },
        { id: "M1_8", round: "Kolejka 1", t1: "Manchester City", t2: "AFC Bournemouth", lock: "2026-08-21T21:00:00" },
        { id: "M1_9", round: "Kolejka 1", t1: "Newcastle United", t2: "Liverpool", lock: "2026-08-21T21:00:00" },
        { id: "M1_10", round: "Kolejka 1", t1: "Fulham", t2: "Chelsea", lock: "2026-08-21T21:00:00" }
    ];

    function getLogoHtml(team) {
        return TEAM_LOGOS[team] ? `<img src="${TEAM_LOGOS[team]}" class="team-logo">` : '';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
    }

    window.onload = () => {
        const nick = localStorage.getItem('typerNick');
        if (nick) showApp(nick);
    };

    function loginUser() {
        const nick = document.getElementById('nick-input').value.trim();
        if (nick.length < 3) return alert('Nick za krótki!');
        localStorage.setItem('typerNick', nick);
        showApp(nick);
    }

    async function showApp(nick) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display').innerText = nick;
        renderProgressBar();
        await loadAllDataFromGoogle();
    }

    function renderProgressBar() {
        const bar = document.getElementById('steps-bar');
        bar.innerHTML = "";
        roundsOrder.forEach((r, idx) => {
            const span = document.createElement('span');
            span.className = `progress-step ${idx === currentRoundIndex ? 'active' : ''}`;
            span.innerText = r; 
            span.onclick = () => { currentRoundIndex = idx; renderProgressBar(); renderAll(); };
            bar.appendChild(span);
        });
    }

    async function loadAllDataFromGoogle() {
        try {
            const res = await fetch(`${API_URL}?action=getAllData`);
            dbData = await res.json();
            renderAll();
        } catch(e) {
            console.error("Błąd pobierania danych:", e);
        }
    }

    function renderAll() {
        renderMatchesList();
        renderAllPredsTable();
        calculateAndRenderLeaderboard();
    }

    function renderMatchesList() {
        const nick = localStorage.getItem('typerNick');
        const currentRound = roundsOrder[currentRoundIndex];
        const container = document.getElementById('matches-list');
        container.innerHTML = "";
        const matches = allMatches.filter(m => m.round === currentRound);
        const userPreds = (dbData.predictions[currentRound] && dbData.predictions[currentRound][nick]) || {};
        const now = new Date();

        matches.forEach(m => {
            const pred = userPreds[m.id] ? userPreds[m.id].split(':') : ["", ""];
            const isLocked = now >= new Date(m.lock);
            
            const div = document.createElement('div');
            div.className = "match-row";
            div.innerHTML = `
                <div class="match-info">
                    <span class="match-teams">${getLogoHtml(m.t1)} ${m.t1} - ${getLogoHtml(m.t2)} ${m.t2}</span>
                </div>
                <div class="score-inputs">
                    <input type="number" class="home-inp" data-id="${m.id}" value="${pred[0]}" ${isLocked ? 'disabled' : ''}>
                    <span>:</span>
                    <input type="number" class="away-inp" data-id="${m.id}" value="${pred[1]}" ${isLocked ? 'disabled' : ''}>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function submitEntireRound() {
        const nick = localStorage.getItem('typerNick');
        const currentRound = roundsOrder[currentRoundIndex];
        const updateData = { "gracz": nick, "kolejka": currentRound };

        document.querySelectorAll('.match-row').forEach(row => {
            const h = row.querySelector('.home-inp');
            const a = row.querySelector('.away-inp');
            if (h && a && h.value !== "" && a.value !== "") {
                updateData[h.getAttribute('data-id')] = `${h.value}:${a.value}`;
            }
        });

        document.getElementById('save-btn').innerText = "Zapisywanie...";
        await fetch(API_URL, { method: 'POST', body: JSON.stringify(updateData) });
        document.getElementById('save-btn').innerText = "💾 Zapisz Typy";
        await loadAllDataFromGoogle();
        alert("Zapisano!");
    }

    function renderAllPredsTable() {
        const currentRound = roundsOrder[currentRoundIndex];
        const matches = allMatches.filter(m => m.round === currentRound);
        const header = document.getElementById('all-preds-header');
        const tbody = document.getElementById('all-preds-body');
        const now = new Date();

        header.innerHTML = "<th>Gracz</th>";
        matches.forEach(m => {
            const score = dbData.results[m.id] || '?-?';
            header.innerHTML += `<th>${getLogoHtml(m.t1)}${getLogoHtml(m.t2)}<br><small>(${score})</small></th>`;
        });

        tbody.innerHTML = "";
        const roundData = dbData.predictions[currentRound] || {};
        const players = Object.keys(roundData);

        if (players.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${matches.length + 1}">Brak typów.</td></tr>`;
            return;
        }

        players.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${p}</b></td>`;
            
            matches.forEach(m => {
                const pred = roundData[p][m.id] || "-";
                const real = dbData.results[m.id];
                const isLocked = now >= new Date(m.lock);
                let cls = "";
                let display = pred;

                if (p !== localStorage.getItem('typerNick') && !isLocked) display = "🔒";

                if (real && pred !== "-" && isLocked) {
                    const pts = computePoints(pred, real);
                    if (pts === 60) cls = "tag-exact";
                    else if (pts === 25) cls = "tag-winner";
                }

                tr.innerHTML += `<td class="${cls}">${display}</td>`;
            });
            tbody.appendChild(tr);
        });
    }

    function calculateAndRenderLeaderboard() {
        const leaderboard = {};

        // Przechodzimy przez wszystkie zakłady i mecze
        for (let roundName in dbData.predictions) {
            for (let player in dbData.predictions[roundName]) {
                if (!leaderboard[player]) leaderboard[player] = 0;

                for (let matchId in dbData.predictions[roundName][player]) {
                    const pred = dbData.predictions[roundName][player][matchId];
                    const real = dbData.results[matchId];

                    if (pred && real) {
                        leaderboard[player] += computePoints(pred, real);
                    }
                }
            }
        }

        const sorted = Object.keys(leaderboard)
            .map(p => ({ gracz: p, punkty: leaderboard[p] }))
            .sort((a, b) => b.punkty - a.punkty);

        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = "";

        if (sorted.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3">Brak danych.</td></tr>`;
            return;
        }

        sorted.forEach((row, i) => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${i + 1}</b></td>
                    <td style="text-align:left; padding-left:10px;">${row.gracz}</td>
                    <td style="font-weight:bold; color:#028a5a;">${row.punkty} pkt</td>
                </tr>`;
        });
    }

    // Funkcja licząca punkty bezpośrednio w przeglądarce
    function computePoints(pred, real) {
        if (!pred || !real || pred.indexOf(':') === -1 || real.indexOf(':') === -1) return 0;
        const p = pred.split(':').map(Number);
        const r = real.split(':').map(Number);

        if (isNaN(p[0]) || isNaN(p[1]) || isNaN(r[0]) || isNaN(r[1])) return 0;

        // Trafiony idealny wynik = 60 pkt
        if (p[0] === r[0] && p[1] === r[1]) return 60;

        // Trafiony zwycięzca/remis = 25 pkt
        const realWinner = r[0] > r[1] ? 1 : (r[0] < r[1] ? 2 : 0);
        const predWinner = p[0] > p[1] ? 1 : (p[0] < p[1] ? 2 : 0);

        if (realWinner === predWinner) return 25;

        return 0;
    }
</script>
</body>
</html>
