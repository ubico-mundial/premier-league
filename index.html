    // ⚠️ TUTAJ WKLEJ SWÓJ URL WYGENEROWANY Z GOOGLE APPS SCRIPT
    const API_URL = "PROSZE_TUTAJ_WKLEIC_URL_Z_GOOGLE_APPS_SCRIPT";
    const KEY_NAME = "sheet2"; 

    const roundsOrder = ["Kolejka 1", "Kolejka 2", "Kolejka 3", "Kolejka 4", "Kolejka 5"];
    let currentRoundIndex = 0; 
    let localDraftScores = {}; 
    let selectedScorers = [null, null, null, null, null]; 
    let currentActiveSlotIndex = 0;

    // Funkcja zarządzania trybem ciemnym
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = "☀️ Jasny";
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('theme-btn').innerText = isDark ? "☀️ Jasny" : "🌙 Ciemny";
    }

    const teamMeta = {
        "Arsenal": { logo: "logos/england_arsenal_64x64.football-logos.cc.png", players: ["Bukayo Saka", "Martin Ødegaard", "Kai Havertz", "Declan Rice", "William Saliba", "Gabriel Magalhães"] },
        "Manchester City": { logo: "logos/england_manchester-city_64x64.football-logos.cc.png", players: ["Erling Haaland", "Kevin De Bruyne", "Phil Foden", "Bernardo Silva", "Rodri", "Josko Gvardiol"] },
        "Liverpool": { logo: "logos/england_liverpool_64x64.football-logos.cc.png", players: ["Mohamed Salah", "Luis Díaz", "Darwin Núñez", "Diogo Jota", "Alexis Mac Allister", "Virgil van Dijk", "Trent Alexander-Arnold"] },
        "Chelsea": { logo: "logos/england_chelsea_64x64.football-logos.cc.png", players: ["Cole Palmer", "Nicolas Jackson", "Christopher Nkunku", "Noni Madueke", "Enzo Fernández"] },
        "Manchester United": { logo: "logos/england_manchester-united_64x64.football-logos.cc.png", players: ["Bruno Fernandes", "Marcus Rashford", "Alejandro Garnacho", "Rasmus Højlund"] },
        "Tottenham Hotspur": { logo: "logos/england_tottenham_64x64.football-logos.cc.png", players: ["Heung-min Son", "Dominic Solanke", "Dejan Kulusevski", "James Maddison"] },
        "Aston Villa": { logo: "logos/england_aston-villa_64x64.football-logos.cc.png", players: ["Ollie Watkins", "Leon Bailey", "John McGinn", "Jhon Durán"] },
        "Newcastle United": { logo: "logos/england_newcastle_64x64.football-logos.cc.png", players: ["Alexander Isak", "Anthony Gordon", "Bruno Guimarães", "Kieran Trippier"] },
        "Everton": { logo: "logos/england_everton_64x64.football-logos.cc.png", players: ["Dominic Calvert-Lewin", "Dwight McNeil"] },
        "Crystal Palace": { logo: "logos/england_crystal-palace_64x64.football-logos.cc.png", players: ["Jean-Philippe Mateta", "Eberechi Eze"] },
        "Nottingham Forest": { logo: "logos/england_nottingham-forest_64x64.football-logos.cc.png", players: ["Chris Wood", "Morgan Gibbs-White"] },
        "Brentford": { logo: "logos/england_brentford_64x64.football-logos.cc.png", players: ["Bryan Mbeumo", "Yoane Wissa"] },
        "Brighton": { logo: "logos/england_brighton_64x64.football-logos.cc.png", players: ["Danny Welbeck", "Joao Pedro"] },
        "AFC Bournemouth": { logo: "logos/england_bournemouth_64x64.football-logos.cc.png", players: ["Antoine Semenyo", "Evanilson"] },
        "Fulham": { logo: "logos/england_fulham_64x64.football-logos.cc.png", players: ["Raúl Jiménez", "Alex Iwobi"] },
        "Coventry City": { logo: "logos/england_coventry-city_64x64.football-logos.cc.png", players: ["Ellis Simms", "Haji Wright"] },
        "Hull City": { logo: "logos/england_hull-city_64x64.football-logos.cc.png", players: ["Striker A", "Winger B"] },
        "Ipswich Town": { logo: "logos/england_ipswich_64x64.football-logos.cc.png", players: ["Liam Delap", "Omari Hutchinson"] },
        "Sunderland": { logo: "logos/england_sunderland_64x64.football-logos.cc.png", players: ["Romaine Mundle", "Patrick Roberts"] },
        "Leeds United": { logo: "logos/england_leeds-united_64x64.football-logos.cc.png", players: ["Mateo Joseph", "Wilfried Gnonto"] }
    };

    const allMatches = [
        { id: "M1_1", round: "Kolejka 1", t1: "Arsenal", t2: "Coventry City", lock: "2026-08-21T21:00:00" },
        { id: "M1_2", round: "Kolejka 1", t1: "Hull City", t2: "Manchester United", lock: "2026-08-21T21:00:00" },
        { id: "M1_3", round: "Kolejka 1", t1: "Everton", t2: "Crystal Palace", lock: "2026-08-21T21:00:00" },
        { id: "M1_4", round: "Kolejka 1", t1: "Ipswich Town", t2: "Sunderland", lock: "2026-08-21T21:00:00" },
        { id: "M1_5", round: "Kolejka 1", t1: "Nottingham Forest", t2: "Leeds United", lock: "2026-08-21T21:00:00" },
        { id: "M1_6", round: "Kolejka 1", t1: "Brentford", t2: "Tottenham Hotspur", lock: "2026-08-21T21:00:00" },
        { id: "M1_7", round: "Kolejka 1", t1: "Brighton", t2: "Aston Villa", lock: "2026-08-21T21:00:00" },
        { id: "M1_8", round: "Kolejka 1", t1: "Manchester City", t2: "AFC Bournemouth", lock: "2026-08-21T21:00:00" },
        { id: "M1_9", round: "Kolejka 1", t1: "Newcastle United", t2: "Liverpool", lock: "2026-08-21T21:00:00" },
        { id: "M1_10", round: "Kolejka 1", t1: "Fulham", t2: "Chelsea", lock: "2026-08-21T21:00:00" },

        { id: "M2_1", round: "Kolejka 2", t1: "Sunderland", t2: "Arsenal", lock: "2026-08-29T16:00:00" },
        { id: "M2_2", round: "Kolejka 2", t1: "Nottingham Forest", t2: "Tottenham Hotspur", lock: "2026-08-29T16:00:00" },
        { id: "M2_3", round: "Kolejka 2", t1: "Newcastle United", t2: "Aston Villa", lock: "2026-08-29T16:00:00" },
        { id: "M2_4", round: "Kolejka 2", t1: "Manchester United", t2: "AFC Bournemouth", lock: "2026-08-29T16:00:00" },
        { id: "M2_5", round: "Kolejka 2", t1: "Manchester City", t2: "Brentford", lock: "2026-08-29T16:00:00" },
        { id: "M2_6", round: "Kolejka 2", t1: "Liverpool", t2: "Brighton", lock: "2026-08-29T16:00:00" },
        { id: "M2_7", round: "Kolejka 2", t1: "Leeds United", t2: "Chelsea", lock: "2026-08-29T16:00:00" },
        { id: "M2_8", round: "Kolejka 2", t1: "Ipswich Town", t2: "Coventry City", lock: "2026-08-29T16:00:00" },
        { id: "M2_9", round: "Kolejka 2", t1: "Hull City", t2: "Crystal Palace", lock: "2026-08-29T16:00:00" },
        { id: "M2_10", round: "Kolejka 2", t1: "Fulham", t2: "Everton", lock: "2026-08-29T16:00:00" }
    ];

    async function initApp() {
        initTheme(); 
        document.getElementById('loading-screen').classList.add('hidden');
        
        // Czyszczenie starego zapisanego nicku, tak aby gracz ZAWSZE musiał podać go na nowo
        localStorage.removeItem('typerNick');
        
        loadLeaderboard();
        document.getElementById('login-screen').classList.remove('hidden');
    }
    window.onload = initApp;

    function loginUser() {
        const nickInput = document.getElementById('nick-input');
        const nick = nickInput.value.trim();
        if (nick.length < 3) return alert('Nick musi mieć min. 3 znaki!');
        
        // Zapis tymczasowy w pamięci podręcznej przeglądarki na czas bieżącej sesji
        sessionStorage.setItem('activeTyperNick', nick);
        
        document.getElementById('login-screen').classList.add('hidden');
        showApp(nick);
    }

    function logoutUser() {
        sessionStorage.removeItem('activeTyperNick');
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('nick-input').value = "";
    }

    function showApp(nick) {
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display').innerHTML = `${nick} <button onclick="logoutUser()" style="display:inline-block; width:auto; padding:2px 8px; font-size:11px; margin-left:10px; background:#ff4a4a; color:white; border:none;">Zmień nick</button>`;
        renderProgressBar();
        renderActiveRound();
        buildTeamsGrid();
        activeSlot(0);
    }

    function renderProgressBar() {
        const bar = document.getElementById('steps-bar');
        bar.innerHTML = "";
        roundsOrder.forEach((r, idx) => {
            const span = document.createElement('span');
            span.className = `progress-step ${idx === currentRoundIndex ? 'active' : ''}`;
            span.innerText = r; 
            span.onclick = () => changeRound(idx);
            bar.appendChild(span);
        });
    }

    function changeRound(targetIndex) {
        saveCurrentInputsToDraft();
        currentRoundIndex = targetIndex;
        selectedScorers = [null, null, null, null, null];
        renderProgressBar();
        renderActiveRound();
        backToMatches();
    }

    function saveCurrentInputsToDraft() {
        const rows = document.querySelectorAll('.match-row');
        rows.forEach(row => {
            const id = row.getAttribute('data-id');
            const homeInput = row.querySelector('.home-team');
            const awayInput = row.querySelector('.away-team');
            if(homeInput && awayInput) {
                localDraftScores[`home-${id}`] = homeInput.value;
                localDraftScores[`away-${id}`] = awayInput.value;
            }
        });
    }

    function renderActiveRound() {
        const currentRound = roundsOrder[currentRoundIndex];
        document.getElementById('group-title').innerText = `⚽ RUNDA TYPOWANIA: ${currentRound.toUpperCase()}`;
        
        const container = document.getElementById('matches-list');
        container.innerHTML = "";
        
        const roundMatches = allMatches.filter(m => m.round === currentRound);
        if(roundMatches.length === 0) return;

        const now = new Date();

        roundMatches.forEach((match) => {
            const div = document.createElement('div');
            div.className = "match-row";
            div.setAttribute('data-id', match.id);
            
            const savedHome = localDraftScores[`home-${match.id}`] || "";
            const savedAway = localDraftScores[`away-${match.id}`] || "";
            
            const f1 = `<img src="${teamMeta[match.t1]?.logo || ''}" style="width:20px; height:20px; object-fit:contain; vertical-align:middle;">`;
            const f2 = `<img src="${teamMeta[match.t2]?.logo || ''}" style="width:20px; height:20px; object-fit:contain; vertical-align:middle;">`;

            // Sprawdzanie czy KONKRETNY MECZ się rozpoczął
            const matchLockTime = new Date(match.lock);
            const isMatchLocked = (now >= matchLockTime);

            let statusMessage = `⏰ Start: ${match.lock.replace('T', ' ').substring(0,16)}`;
            if (isMatchLocked) {
                statusMessage = `<span class="locked-text">🔒 Zablokowane (Mecz trwa / zakończony)</span>`;
            }

            div.innerHTML = `
                <div class="match-info">
                    <span class="match-teams">${f1} ${match.t1} - ${f2} ${match.t2}</span>
                    <span class="match-date">${statusMessage}</span>
                </div>
                <div class="score-inputs">
                    <input type="number" class="home-team score-field" min="0" placeholder="-" value="${savedHome}" ${isMatchLocked ? 'disabled' : ''} oninput="handleAutoAdvance(this)">
                    <span>:</span>
                    <input type="number" class="away-team score-field" min="0" placeholder="-" value="${savedAway}" ${isMatchLocked ? 'disabled' : ''} oninput="handleAutoAdvance(this)">
                </div>
            `;
            container.appendChild(div);
        });
        validateMatchesCompletion();
    }

    function handleAutoAdvance(currentInput) {
        validateMatchesCompletion();

        if (currentInput.value === "") return;

        const allInputs = Array.from(document.querySelectorAll('.score-field:not([disabled])'));
        const currentIndex = allInputs.indexOf(currentInput);

        if (currentIndex !== -1 && currentIndex < allInputs.length - 1) {
            const nextInput = allInputs[currentIndex + 1];
            nextInput.focus();
            nextInput.select();
        }
    }

    function validateMatchesCompletion() {
        const btn = document.getElementById('next-stage-btn');
        const rows = document.querySelectorAll('.match-row');
        let allFilled = true;
        
        rows.forEach(row => {
            const home = row.querySelector('.home-team').value;
            const away = row.querySelector('.away-team').value;
            if(home === "" || away === "") allFilled = false;
        });

        if(allFilled) {
            btn.removeAttribute('disabled');
            btn.innerText = "Przejdź do wyboru strzelców ➔";
        } else {
            btn.setAttribute('disabled', 'true');
            btn.innerText = "Uzupełnij wszystkie wyniki meczów";
        }
    }

    function goToScorersStage() {
        saveCurrentInputsToDraft();
        document.getElementById('step-matches-view').classList.add('hidden');
        document.getElementById('step-scorers-view').classList.remove('hidden');
        updateScorersUI();
    }

    function backToMatches() {
        document.getElementById('step-scorers-view').classList.add('hidden');
        document.getElementById('step-matches-view').classList.remove('hidden');
        renderActiveRound();
    }

    function buildTeamsGrid() {
        const grid = document.getElementById('teams-logos-grid');
        grid.innerHTML = "";
        Object.keys(teamMeta).forEach(teamName => {
            const btn = document.createElement('div');
            btn.className = "team-btn";
            btn.innerHTML = `<img src="${teamMeta[teamName].logo}" style="width:32px; height:32px; object-fit:contain; margin-bottom:4px;"><div>${teamName}</div>`;
            btn.onclick = () => showPlayersForTeam(teamName);
            grid.appendChild(btn);
        });
    }

    function showPlayersForTeam(teamName) {
        document.getElementById('players-list-zone').classList.remove('hidden');
        document.getElementById('selected-team-title').innerText = `Skład zespołu: ${teamName}`;
        
        const grid = document.getElementById('players-buttons-grid');
        grid.innerHTML = "";
        
        const players = teamMeta[teamName].players || [];
        players.forEach(player => {
            const btn = document.createElement('button');
            btn.className = "player-btn";
            btn.innerText = player;
            btn.onclick = () => selectPlayerForActiveSlot(player, teamName);
            grid.appendChild(btn);
        });
    }

    function activeSlot(idx) {
        currentActiveSlotIndex = idx;
        const isDark = document.body.classList.contains('dark-mode');
        for(let i=0; i<5; i++) {
            document.getElementById(`slot-${i}`).style.borderColor = (i === idx) ? '#00ff87' : (isDark ? '#4a2850' : '#38003c');
            document.getElementById(`slot-${i}`).style.background = (i === idx) ? (isDark ? '#153a28' : '#e6fff4') : (isDark ? '#2d1830' : '#edf2f7');
        }
    }

    function selectPlayerForActiveSlot(playerName, teamName) {
        selectedScorers[currentActiveSlotIndex] = { player: playerName, team: teamName };
        updateScorersUI();
        
        let nextSlot = selectedScorers.findIndex(s => s === null);
        if(nextSlot !== -1) {
            activeSlot(nextSlot);
        }
    }

    function updateScorersUI() {
        selectedScorers.forEach((data, idx) => {
            const slotSpan = document.querySelector(`#slot-${idx} span`);
            if(data) {
                slotSpan.innerHTML = `<img src="${teamMeta[data.team].logo}" style="width:18px; height:18px; object-fit:contain; vertical-align:middle; margin-right:5px;"> <b>${data.player}</b> (${data.team})`;
            } else {
                slotSpan.innerText = "Wybierz zawodnika...";
            }
        });

        const finalBtn = document.getElementById('final-submit-btn');
        const allScorersSelected = selectedScorers.every(s => s !== null);
        if(allScorersSelected) {
            finalBtn.removeAttribute('disabled');
        } else {
            finalBtn.setAttribute('disabled', 'true');
        }
    }

    async function submitEntireRound() {
        const currentRound = roundsOrder[currentRoundIndex];
        const nick = sessionStorage.getItem('activeTyperNick');

        if (!nick) {
            alert('Sesja wygasła. Zaloguj się ponownie.');
            return logoutUser();
        }

        const updateData = { 
            "gracz": nick,
            "kolejka": currentRound,
            "strzelcy": selectedScorers.map(s => `${s.player} (${s.team})`).join(", ")
        };

        const roundMatches = allMatches.filter(m => m.round === currentRound);
        roundMatches.forEach(m => {
            updateData[m.id] = `${localDraftScores[`home-${m.id}`]}:${localDraftScores[`away-${m.id}`]}`;
        });

        try {
            const finalBtn = document.getElementById('final-submit-btn');
            finalBtn.setAttribute('disabled', 'true');
            finalBtn.innerText = "Wysyłanie / Aktualizacja bazy danych...";

            await fetch(API_URL, { method: 'POST', body: JSON.stringify(updateData) });

            alert(`Twoje typy na ${currentRound} zostały pomyślnie zapisane/zaktualizowane! 🚀`);
            location.reload();
        } catch (error) {
            alert('Wystąpił błąd podczas zapisu: ' + error.message);
            document.getElementById('final-submit-btn').removeAttribute('disabled');
        }
    }

    async function loadLeaderboard() {
        const tbody = document.getElementById('leaderboard-body');
        try {
            const response = await fetch(`${API_URL}?action=getLeaderboard`);
            if (!response.ok) throw new Error("Błąd sieci");
            
            const data = await response.json();
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3">Brak zarejestrowanych punktów w bazie. Wpisz oficjalne wyniki w arkusz!</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="rank-badge">${index + 1}</span></td>
                    <td style="text-align: left; padding-left: 15px; font-weight: bold; color: var(--text);">${row.gracz}</td>
                    <td style="font-weight: bold; color: #028a5a; font-size: 15px;">${row.punkty} pkt</td>
                `;
                tbody.innerHTML += tr.outerHTML;
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="3" style="color:var(--danger)">Nie udało się załadować rankingu (Upewnij się, że wkleiłeś poprawny URL skryptu API)</td></tr>`;
        }
    }
</script>
